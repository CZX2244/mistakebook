name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: Build and verify wheel install
        run: |
          rm -rf dist
          python -m pip wheel . --no-deps --wheel-dir dist
          python -m pip uninstall -y mistakebook
          WHEEL=$(find dist -name 'mistakebook-*.whl' -print -quit)
          python -m pip install "$WHEEL"
          python -m pip check
          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          mistakebook --help
          python -c "import mistakebook; import mistakebook.cli; import mistakebook.core; import mistakebook.scheduler"
