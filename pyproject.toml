[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mistakebook"
version = "0.1.0"
description = "A spaced-repetition mistake notebook (错题本) for students and AI agents. Zero dependencies, SQLite-backed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "CZX2244", email = "ddyx2021@outlook.com" }]
keywords = ["spaced-repetition", "education", "study", "cli", "agent", "错题本"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
# Zero runtime dependencies — stdlib only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mistakebook = "mistakebook.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mistakebook*"]
